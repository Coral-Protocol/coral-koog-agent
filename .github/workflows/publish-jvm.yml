name: Build and Push (JVM)

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build-and-push-jvm:
    name: Build and push JVM image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tag parts
        id: meta
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          BRANCH="${BRANCH//\//-}"
          BRANCH="${BRANCH,,}"
          COMMITS="$(git rev-list --count HEAD)"
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commits=$COMMITS" >> "$GITHUB_OUTPUT"
          echo "tag=$BRANCH-$COMMITS-jvm" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$REPO_LOWER" >> "$GITHUB_OUTPUT"
          echo "repo_name=$REPO_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (JVM)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.jvm
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ steps.meta.outputs.repo_name }} (jvm)

      - name: Slim image (JVM)
        uses: kitabisa/docker-slim-action@v1
        env:
          DSLIM_HTTP_PROBE: false
        with:
          target: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          tag: "${{ steps.meta.outputs.tag }}-slim"

      - name: Push images (JVM and slim)
        run: |
          docker image push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          docker image push ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-slim

      - name: Generate coral-agent.toml for release
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-slim
        run: |
          # Find the line number of the first occurrence of runtimes section (commented or not)
          LINE_NUM=$(grep -nE '^\s*#?\s*\[runtimes\.' coral-agent.toml | head -n 1 | cut -d: -f1)
          if [ -n "$LINE_NUM" ]; then
            # Delete from that line to the end of file
            sed -i "${LINE_NUM},\$d" coral-agent.toml
          fi
          # Append the new [runtimes.docker] section
          printf "\n[runtimes.docker]\nimage = \"$IMAGE_TAG\"\n" >> coral-agent.toml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          files: coral-agent.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
