edition = 2
[agent]
name = "koog-agent"
version = "0.1.0"
description = "A Koog (Kotlin) example agent for Coral that supports MCP resources and Coral claims."

[options]
MAX_ITERATIONS = { type = "number", default = 10, description = "The maximum number of LLM iterations (ignoring tool calls) to run." }

[options.EXTRA_SYSTEM_PROMPT]
type = "string"
description = "Additional system prompt instructions to customize the agent's behavior."
default = ""
display.multiline = true

[options.EXTRA_INITIAL_USER_PROMPT]
type = "string"
description = "Additional instructions to be included in the initial user message."
default = ""
display.multiline = true

[options.FOLLOWUP_USER_PROMPT]
type = "string"
description = "The prompt to use for follow-up iterations."
default = "[automated message] Continue fulfilling your responsibilities collaboratively to the best of your ability."
display.multiline = true

[options.MODEL_PROVIDER]
type = "string"
description = "The LLM provider to use (OPENAI, OPENROUTER, ANTHROPIC, CORAL_LLM_PROXY)"
default = "OPENAI"

[options.MODEL_PROVIDER_URL_OVERRIDE]
type = "string"
description = "The base URL for the LLM provider API (OpenAI compatible)"
default = ""

[options.MODEL_API_KEY]
secret = true
type = "string"
required = true
description = "The API key for the LLM provider (OpenAI compatible)"

[options.MODEL_ID]
type = "string"
default = "gpt-5o-mini"
description = "The model ID to use for the LLM provider"


[options.SYSTEM_PROMPT]
type = "string"
description = "The system prompt to use"
default = """
You are an AI agent designed to assist users by leveraging available tools and resources. Follow the user's instructions carefully and utilize the tools at your disposal to provide accurate and helpful responses.

-- Start of messages and status --
<resource>coral://instruction</resource>
<resource>coral://state</resource>
-- End of messages and status --

"""
display.multiline = true

[runtimes.executable]
command = ["./gradlew", "run"]
