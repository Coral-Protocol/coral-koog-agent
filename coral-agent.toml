# Coral agent manifest: how Coral Server discovers, configures and runs this agent.
# Reference: https://docs.coralos.ai/reference/agent
# Options: https://docs.coralos.ai/reference/agent/tables/options
# Marketplace: https://docs.coralos.ai/concepts/marketplace
# =====================================================================================
edition = 5

# =====================================================================================
# [agent] — required metadata and optional discovery fields
# =====================================================================================
[agent]
name = "coral-koog-agent"
version = "1.3.0"
summary = "A template agent built with Koog (Kotlin)."
description = "A base template for creating Coral agents using the Koog framework in Kotlin."
readme = """
# Koog Template Agent

This is a template for building autonomous agents in Kotlin using the Koog framework.
"""

# The agent refreshes coral://instruction and coral://state into its system prompt every iteration
capabilities = ["resources"]

[agent.license]
type = "spdx"
expression = "Apache-2.0"

# =====================================================================================
# [marketplace] — discovery, pricing, and identities
# =====================================================================================
[marketplace]
keywords = ["template", "koog", "kotlin", "example"]

[marketplace.pricing]
currency = "USD"
description = """
    Usage-based pricing based on the number of tokens processed by the agent.
    In this template, the pricing per token is independent of model used.
"""
[marketplace.pricing.recommendations]
max = 20.00
min = 0.10

# =====================================================================================
# [options] - parameters that come in as environment variables set by consumer
# =====================================================================================
[options]
MAX_ITERATIONS = { type = "u32", default = 60, display.description = "The maximum number of LLM iterations (ignoring tool calls) to run." }
ITERATION_DELAY_MS = { type = "u64", default = 0, display.description = "The number of milliseconds to wait between iterations. If left unspecified, no delay will occur between iterations." }
MAX_TOKENS = { type = "u32", default = 150000, display.description = "The maximum number of tokens to use for this agent during the entire session." }
CONTEXT_COMPRESSION_TOKENS = { type = "u32", default = 60000, display.description = "When a request's context reaches this many tokens, the conversation history is replaced with a summary. 0 disables compression." }
DEV_CAPTURE_ENV = { type = "bool", default = false, display.group = "Development", display.description = "Development only (executable runtime): write this agent's session environment to coral-agent.dev.env and idle, so DevMain.kt can join the session from an IDE." }
DEV_NATIVE_METADATA = { type = "bool", default = false, display.group = "Development", display.description = "Development only (executable runtime): run on GraalVM with its tracing agent and merge the metadata this run needs into src/native-image, for the native image build." }

[options.EXTRA_SYSTEM_PROMPT]
type = "string"
display.description = "Additional system prompt instructions to customize the agent's behavior."
display.multiline = true
default = ""

[options.EXTRA_INITIAL_USER_PROMPT]
type = "string"
display.description = "Additional instructions to be included in the initial user message."
display.multiline = true
default = ""

[options.FOLLOWUP_USER_PROMPT]
type = "string"
display.description = "The prompt to use for follow-up iterations."
default = "[automated message] Continue fulfilling your responsibilities collaboratively to the best of your ability."
display.multiline = true

[options.MODEL_CHOICE]
type = "string"
default = "LLM_FAST"
display.description = "Which [[llm.proxies]] entry to use. The session decides which provider and model each one maps to."
validation.variants = ["LLM_FAST", "LLM_BIG"]

[options.REASONING_EFFORT]
type = "string"
default = "none"
display.description = "Reasoning effort for OpenAI-format reasoning models. Through Chat Completions, GPT-5.1 and newer only allow tools with \"none\"; gpt-5 and o-series models need \"minimal\" or higher. \"default\" leaves it to the provider."
validation.variants = ["none", "minimal", "low", "medium", "high", "default"]

[options.SYSTEM_PROMPT]
type = "string"
display.description = "The system prompt to use"
default = """
You are an AI agent designed to assist users by leveraging available tools and resources. Follow the user's instructions carefully and utilize the tools at your disposal to provide accurate and helpful responses.
-- Start of messages and status --
<resource>coral://instruction</resource>
<resource>coral://state</resource>
-- End of messages and status --
"""
display.multiline = true

# =====================================================================================
# LLM
# =====================================================================================
# format.type is "OpenAI", "Anthropic" or "DeepSeek". Coral Server routes each proxy to a provider of that format,
# and the agent uses the matching Koog client. Anthropic and DeepSeek need Coral Server 1.5.0 or newer.
[[llm.proxies]]
name = "LLM_FAST"
format.type = "OpenAI"
models = ["gpt-5.6-luna"]

[[llm.proxies]]
name = "LLM_BIG"
format.type = "OpenAI"
models = ["gpt-5.6-sol"]

# =====================================================================================
# Claims: work this agent reports so the session's budget can be charged for it
# =====================================================================================
[[dependencies]]
name = "llm"
options = ["MODEL_CHOICE"]

# No default cost: a session without a budget has $0 to spend, so a priced claim would stop the agent immediately.
# Applications price claims per session (budgetSettings.claimTypeCosts, in micro cents: $1.00 = 100_000_000)
# and set a budget, e.g. "claimTypeCosts": {"LLM_TOKENS": 100} for $1.00 per million tokens.
[[claims]]
name = "LLM_TOKENS"
description = "One LLM token processed (input and output) through the LLM proxy"
dependency = "llm"

# =====================================================================================
# Runtimes
# =====================================================================================
[runtimes.executable]
# For local development. Production servers should use the docker runtime.
path = "./gradlew"
arguments = ["-q", "run"]

#[runtimes.docker]
# The publish workflows generate a release coral-agent.toml with this section filled in.
# Without a tag, Coral Server uses this agent's version as the image tag.
#image = "ghcr.io/<owner>/<repo>"
